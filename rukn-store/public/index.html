<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ركن الهاتف</title>
<meta name="description" content="هواتف جديدة ومستعملة، كفرات وحمايات، اشتراكات تليكرام ونتفلكس، وبطاقات شحن. توصيل لكل محافظات العراق.">
<meta name="theme-color" content="#0C7458">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='2' width='16' height='28' rx='4' fill='none' stroke='%230C7458' stroke-width='3'/%3E%3Crect x='13' y='6' width='6' height='2' rx='1' fill='%230C7458'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/store.css">
</head>
<body>
<div class="notice" id="notice" hidden></div>

<header class="top">
  <div class="wrap top-row">
    <a class="logo" href="#/"><i aria-hidden="true"></i><span id="storeName">ركن الهاتف</span></a>
    <form class="search-box" id="searchForm" role="search">
      <input id="searchInput" type="search" placeholder="ابحث عن جهاز، كفر، اشتراك…" aria-label="بحث">
      <button aria-label="بحث"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </form>
    <a class="icon-link hide-sm" href="#/track">تتبع طلبك</a>
    <button class="cart-btn" id="openCart" aria-label="السلة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <span class="hide-sm">السلة</span><b id="cartCount" class="num">0</b>
    </button>
  </div>
  <nav class="wrap cat-nav" id="catNav" aria-label="الأقسام"></nav>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-foot">
  <div class="wrap foot-grid">
    <div>
      <a class="logo" href="#/"><i aria-hidden="true"></i><span id="footName">ركن الهاتف</span></a>
      <p id="footTagline" class="muted"></p>
      <p id="footAddress" class="muted"></p>
      <p id="footHours" class="muted"></p>
    </div>
    <div>
      <h4>الأقسام</h4>
      <div id="footCats" class="foot-links"></div>
    </div>
    <div>
      <h4>خدمة الزبائن</h4>
      <div class="foot-links">
        <a href="#/track">تتبع طلبك</a>
        <a href="#/contact">راسلنا</a>
        <a href="#/policy">الضمان والاستبدال</a>
      </div>
    </div>
    <div>
      <h4>اتصل بينا</h4>
      <p class="num" dir="ltr" id="footPhone" style="text-align:right"></p>
      <div class="foot-links" id="footSocial"></div>
    </div>
  </div>
  <div class="wrap foot-bottom muted">© <span id="year"></span> <span id="footName2"></span>. جميع الحقوق محفوظة.</div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="سلة المشتريات" aria-hidden="true">
  <div class="drawer-head"><h3>سلة المشتريات</h3><button class="x" id="closeCart" aria-label="إغلاق">×</button></div>
  <div class="drawer-body" id="cartItems"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</aside>

<a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="واتساب" hidden>
  <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2c.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
</a>
<div class="toast" id="toast" hidden></div>

<script src="/js/store.js"></script>
</body>
</html>
