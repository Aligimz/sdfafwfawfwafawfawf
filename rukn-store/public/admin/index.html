<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة · ركن الهاتف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="logo"><i></i><span>لوحة الإدارة</span></div>
    <div class="field"><label for="lUser">اسم المستخدم</label><input id="lUser" autocomplete="username" dir="ltr"></div>
    <div class="field"><label for="lPass">كلمة السر</label><input id="lPass" type="password" autocomplete="current-password" dir="ltr"></div>
    <p class="err" id="lErr" hidden></p>
    <button class="btn primary block">دخول</button>
  </form>
</section>

<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <div class="logo"><i></i><span id="sName">ركن الهاتف</span></div>
    <nav id="nav">
      <a href="#/" data-r="">لوحة التحكم</a>
      <a href="#/orders" data-r="orders">الطلبات <b class="pill" id="nNew" hidden></b></a>
      <a href="#/products" data-r="products">المنتجات</a>
      <a href="#/categories" data-r="categories">الأقسام</a>
      <a href="#/customers" data-r="customers">الزبائن</a>
      <a href="#/messages" data-r="messages">الرسائل <b class="pill" id="nMsg" hidden></b></a>
      <a href="#/reminders" data-r="reminders">التذكيرات <b class="pill warn" id="nRem" hidden></b></a>
      <a href="#/settings" data-r="settings">الإعدادات</a>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener">فتح المتجر ↗</a>
      <span id="who" class="muted"></span>
      <button class="link" id="logout">تسجيل خروج</button>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <button class="menu" id="menuBtn" aria-label="القائمة">☰</button>
      <h1 id="pageTitle">لوحة التحكم</h1>
      <div class="bar-actions" id="barActions"></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="إغلاق">×</button></div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/admin/admin.js"></script>
</body>
</html>
